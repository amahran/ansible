- name: i3 - install
  become: true
  apt:
    name=i3
  tags:
    - i3
  when: ansible_facts['distribution'] in ["Debian", "Ubuntu"]
- name: xss-lock install
  become: true
  package:
    name:
    - i3status-rust
    - xss-lock
  tags:
    - i3
  when: ansible_facts['distribution'] in ["Archlinux"]
- name: i3 - install utils
  become: true
  package:
    name: [ "dunst", "dex", "picom", "feh", "autorandr" ]
  tags:
    - i3
